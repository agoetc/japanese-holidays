name: Sync holidays

on:
  schedule:
    - cron: "0 0 1 * *" # 1st of every month, 09:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate
        run: ./scripts/sync.sh

      - name: Commit
        # A commit every run also keeps the repo active: GitHub disables
        # scheduled workflows in public repos after 60 days without activity.
        run: |
          date -u +%Y-%m-%d > docs/last-checked.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/holidays.csv; then
            message="chore: record holiday check"
          else
            message="chore: sync holidays from Cabinet Office"
          fi
          git add docs/holidays.csv docs/last-checked.txt
          git commit -m "$message"
          git push
