name: Sync holidays

on:
  schedule:
    - cron: "0 0 1 * *" # 1st of every month, 09:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate
        run: ./scripts/sync.sh

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/holidays.csv; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/holidays.csv
          git commit -m "chore: sync holidays from Cabinet Office"
          git push
